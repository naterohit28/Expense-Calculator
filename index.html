<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EA580C">
  <title>Flavor Fusion</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);

  if (params.get("view") === "mobile") {
    window.location.href = "FFmobile.html";
  } else if (params.get("view") === "desktop") {
    window.location.href = "FFexp.html";
  } else {
    const isMobile = /iPhone|Android|iPad|iPod/i.test(navigator.userAgent);
    window.location.href = isMobile ? "FFmobile.html" : "FFexp.html";
  }
</script>
</body>
</html>
